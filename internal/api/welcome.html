<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoopTalent에 오신 것을 환영합니다</title>
<style>
  :root { --blue:#1768e8; --cyan:#22b8ee; --ink:#15213b; --muted:#61708b; --line:#dce4f2; --soft:#f5f8ff; }
  * { box-sizing:border-box; } body { margin:0; background:#f6f9ff; color:var(--ink); font:16px/1.65 "Pretendard","Malgun Gothic","Segoe UI",sans-serif; }
  main { width:min(760px,calc(100% - 32px)); margin:54px auto; }
  .brand { display:flex; align-items:center; justify-content:center; gap:9px; color:var(--blue); font-weight:800; font-size:20px; }
  .logo { width:30px; height:30px; border-radius:10px; background:linear-gradient(135deg,var(--blue),var(--cyan)); position:relative; }
  .logo:after { content:""; position:absolute; left:11px; top:8px; border-left:10px solid white; border-top:7px solid transparent; border-bottom:7px solid transparent; }
  .card { background:#fff; border:1px solid var(--line); border-radius:22px; box-shadow:0 16px 42px #234e9630; padding:42px; margin-top:18px; }
  h1 { font-size:30px; line-height:1.32; text-align:center; letter-spacing:-.04em; margin:4px 0 10px; } .lead { color:var(--muted); text-align:center; margin:0 auto 34px; max-width:500px; }
  .steps { display:grid; grid-template-columns:1fr 1fr; gap:14px; } .step { padding:22px; border-radius:16px; background:var(--soft); border:1px solid #dce8ff; }
  .num { display:inline-grid; place-items:center; width:27px; height:27px; border-radius:50%; background:var(--blue); color:#fff; font-weight:800; font-size:13px; margin-bottom:11px; }
  h2 { font-size:18px; margin:0 0 7px; letter-spacing:-.02em; } p { margin:0; color:var(--muted); font-size:14px; }
  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; justify-content:center; } a.button { padding:12px 18px; border-radius:10px; font-weight:700; text-decoration:none; text-align:center; } .primary { background:var(--blue); color:#fff; } .secondary { background:#fff; border:1px solid var(--line); color:var(--ink); }
  .temp { margin-top:16px; text-align:center; font-size:12px; color:var(--muted); } .privacy { display:block; text-align:center; font-size:13px; margin-top:24px; color:var(--muted); }
  @media (max-width:560px) { main { margin:24px auto; } .card { padding:28px 20px; } h1 { font-size:25px; } .steps { grid-template-columns:1fr; } .actions { flex-direction:column; } }
</style>
</head>
<body>
<main>
  <div class="brand"><span class="logo"></span>SoopTalent</div>
  <section class="card">
    <h1>환영합니다!<br>달란트 운영을 시작해 볼까요?</h1>
    <p class="lead">처음 한 번만 설정하면, 이후에는 방송과 시청자 참여를 편하게 관리할 수 있습니다.</p>
    <div class="steps">
      <article class="step"><span class="num">1</span><h2>스트리머 확장 설치</h2><p>랭킹 동기화와 방송국 게시글·댓글의 달란트 지급 버튼을 사용하려면 필요합니다.</p></article>
      <article class="step"><span class="num">2</span><h2>방송국 연결 신청</h2><p>확장에서 SOOP에 로그인한 뒤 연결을 신청하세요. 운영자 승인 후 바로 시작됩니다.</p></article>
    </div>
    <div class="actions">
      <a id="install" class="button primary" href="{{STREAMER_EXTENSION_INSTALL_URL}}" target="_blank" rel="noopener">스트리머 확장 설치하기</a>
      <a class="button secondary" href="/guide" target="_blank" rel="noopener">사용 가이드 보기</a>
      <a id="start" class="button secondary" href="/">대시보드로 가기</a>
    </div>
    <div class="temp">Chrome Web Store에서 안전하게 설치할 수 있습니다.</div>
    <a class="privacy" href="/privacy" target="_blank" rel="noopener">개인정보처리방침</a>
  </section>
</main>
<script>
(() => {
  const p = new URLSearchParams(location.hash.slice(1));
  const token = p.get("token");
  if (token) {
    localStorage.setItem("sooptalent.token", token);
    history.replaceState(null, "", location.pathname);
  }
})();
</script>
</body>
</html>
