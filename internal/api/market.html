<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>달란트 시장 · SoopTalent</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--blue:#1757d9;--sky:#eaf4ff;--ink:#102040;--muted:#64748b;--line:#dce5f3;--good:#087a52;--bad:#c23737;background:#f4f8ff;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif}header{background:linear-gradient(110deg,#164cce,#159ee5);color:#fff;padding:26px max(20px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;gap:16px;align-items:center}a{color:inherit}.brand{font-size:20px;font-weight:800;text-decoration:none}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 28px #1d4d8c0d}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}.hero h1{margin:0;font-size:28px}.muted{color:var(--muted)}.balance{font-weight:800;color:var(--blue);font-size:18px}.grid{display:grid;grid-template-columns:1fr 310px;gap:20px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:9px}.item img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;background:var(--sky)}.item h3{margin:0;font-size:16px}.price{color:var(--blue);font-weight:800}.stock{font-size:12px;color:var(--muted)}.qty{display:flex;align-items:center;gap:8px}.qty button{width:30px;height:30px;border:1px solid var(--line);border-radius:7px;background:#fff;font-size:18px;cursor:pointer}.qty output{min-width:22px;text-align:center;font-weight:700}.cart{position:sticky;top:18px;height:max-content}.cart h2{font-size:18px;margin:0 0 12px}.cartline{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:14px;margin-top:12px}button.primary{border:0;border-radius:9px;background:var(--blue);color:#fff;font-weight:800;padding:12px 16px;cursor:pointer;width:100%;margin-top:16px}button.primary:disabled{opacity:.5;cursor:not-allowed}.notice{margin:0 0 18px;border-radius:12px;padding:14px 16px;background:var(--sky);color:#17477e}.notice.bad{background:#fff0f0;color:var(--bad)}.login{max-width:480px;margin:70px auto;text-align:center}.login h1{margin-top:0}.empty{padding:28px;color:var(--muted);text-align:center}.success{background:#ecfdf5;color:var(--good)}@media(max-width:760px){header{padding:18px 20px}.wrap{margin:20px auto}.grid{grid-template-columns:1fr}.cart{position:static}.hero h1{font-size:23px}}
.my-orders{margin-top:20px}.my-order{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--line)}.my-order:first-of-type{border-top:0}.my-order .meta{display:grid;gap:2px;min-width:0}.my-order .meta strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.my-order .meta span{font-size:13px;color:var(--muted)}button.cancel{border:1px solid #f0b9b9;background:#fff;color:var(--bad);border-radius:7px;padding:7px 10px;white-space:nowrap;cursor:pointer}.privacy-check{display:flex;align-items:flex-start;gap:8px;margin-top:13px;text-align:left;color:var(--muted);font-size:12px;line-height:1.45;cursor:pointer}.privacy-check input{width:auto;margin:3px 0 0;flex:0 0 auto}.privacy-check a{color:var(--blue)}
</style>
</head><body>
<header><a class="brand" href="/">SoopTalent</a><span id="who" class="muted" style="color:#e9f5ff"></span></header>
<main class="wrap"><div id="app" class="card empty">시장을 불러오는 중입니다…</div></main>
<script>
let rewardUnit = "달란트";
const unitText = text => String(text ?? "").split("달란트").join(rewardUnit);
const KEY="sooptalent.token";let token=localStorage.getItem(KEY)||"";const marketToken=location.pathname.split("/").filter(Boolean).pop();let data=null;const cart=new Map();
const el=(tag,props={},...children)=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==="class")n.className=v;else if(k.startsWith("on"))n.addEventListener(k.slice(2).toLowerCase(),v);else n[k]=v}n.append(...children.flat().filter(Boolean).map(x=>typeof x==="string"?document.createTextNode(x):x));return n};
const num=n=>new Intl.NumberFormat("ko-KR").format(n||0);
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"Content-Type":"application/json",...(token?{Authorization:`Bearer ${token}`}:{})}});const b=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(unitText(b.error||`요청 실패 (${r.status})`));e.status=r.status;throw e}return b}
function parseCallback(){const q=new URLSearchParams(location.hash.slice(1));if(q.get("token")){token=q.get("token");localStorage.setItem(KEY,token);history.replaceState(null,"",location.pathname)}if(q.get("error"))throw new Error(q.get("error"))}
function login(){location.href=`/api/oauth/soop/start?redirect_uri=${encodeURIComponent(location.origin+location.pathname)}`}
function closed(message){$(el("div",{class:"notice bad"},message||unitText("이 달란트 시장은 종료되었습니다.")))}
function $(...nodes){const app=document.querySelector("#app");app.replaceChildren(...nodes)}
function maxFor(it){let max=it.stock==null?1000:Math.max(0,it.stock);if(it.perUserLimit!=null)max=Math.min(max,it.perUserLimit);return max}
function change(it,by){const n=Math.max(0,Math.min(maxFor(it),Number(cart.get(it.id)||0)+by));n?cart.set(it.id,n):cart.delete(it.id);render()}
function render(){
  const p=data.page;
  document.querySelector("#who").textContent=`${data.viewer.nickname||data.viewer.id} 님`;
  const items=el("div",{class:"items"});
  for(const it of p.items){
    const q=Number(cart.get(it.id)||0);
    const count=el("output",{},String(q));
    const stockText=it.stock==null?"수량 제한 없음":`남은 총 수량 ${num(it.stock)}`;
    const limitText=it.perUserLimit==null?"인당 제한 없음":`인당 최대 ${num(it.perUserLimit)}개`;
    items.append(el("article",{class:"item"},it.imageId?el("img",{src:`/api/shop/images/${it.imageId}`,alt:""}):null,el("h3",{},it.name),el("div",{class:"price"},unitText(`${num(it.price)} 달란트`)),el("div",{class:"stock"},`${stockText} · ${limitText}`),el("div",{class:"qty"},el("button",{onclick:()=>change(it,-1)},"−"),count,el("button",{onclick:()=>change(it,1),disabled:q>=maxFor(it)},"+"))));
  }
  const lines=[...cart.entries()].map(([id,quantity])=>({itemId:id,quantity}));
  const total=lines.reduce((s,l)=>s+(p.items.find(x=>x.id===l.itemId)?.price||0)*l.quantity,0);
  const cartBox=el("aside",{class:"card cart"},el("h2",{},"선택한 보상"));
  if(!lines.length)cartBox.append(el("div",{class:"empty"},"아직 선택한 보상이 없습니다."));
  else for(const l of lines){const it=p.items.find(x=>x.id===l.itemId);cartBox.append(el("div",{class:"cartline"},el("span",{},`${it.name} ×${l.quantity}`),el("strong",{},`${num(it.price*l.quantity)}`)))}
  cartBox.append(el("div",{class:"total"},el("span",{},"합계"),el("span",{},unitText(`${num(total)} 달란트`))),el("button",{class:"primary",disabled:!lines.length||total>data.balance,onclick:()=>checkout(lines,total)},total>data.balance?`${rewardUnit} 부족`:"구매하기"));
  $(el("section",{class:"hero"},el("div",{},el("h1",{},p.title),p.description?el("p",{class:"muted"},p.description):null),el("div",{class:"balance"},unitText(`보유 ${num(data.balance)} 달란트`))),el("div",{class:"grid"},el("section",{class:"card"},items),cartBox),marketOrderHistory());
}

function marketOrderHistory(){
  const box=el("section",{class:"card my-orders"},el("h2",{},"내 구매내역"));
  const orders=data.orders||[];
  if(!orders.length){box.append(el("div",{class:"empty"},"이 시장에서 아직 구매한 보상이 없습니다."));return box}
  for(const o of orders){
    const detail=(o.lines||[]).map(l=>l.quantity>1?`${l.itemName} ×${l.quantity}`:l.itemName).join(", ")||o.rejectReason||"—";
    const state=o.status==="fulfilled"?"구매 확정":o.status==="cancelled"?"환불 완료":"거절";
    const canCancel=o.status==="fulfilled"&&o.marketOpen;
    box.append(el("div",{class:"my-order"},el("div",{class:"meta"},el("strong",{},detail),el("span",{},unitText(`${state} · ${num(o.totalPrice)} 달란트`))),canCancel?el("button",{class:"cancel",onclick:()=>cancelOrder(o.id)},"구매 취소"):null));
  }
  return box;
}
async function loadMarket(){data=await api(`/api/market/${encodeURIComponent(marketToken)}`);rewardUnit=data.rewardUnit||"달란트";document.title=`${rewardUnit} 시장 · SoopTalent`;render()}
async function checkout(lines,total){if(!confirm(`구매 금액: ${num(total)} ${rewardUnit}\n구매하시겠습니까?`))return;const key=crypto.randomUUID().replaceAll("-","");try{const r=await api(`/api/market/${encodeURIComponent(marketToken)}/orders`,{method:"POST",body:JSON.stringify({requestKey:key,lines})});cart.clear();await loadMarket();document.querySelector("#app").prepend(el("div",{class:"notice success"},`구매 완료: ${num(r.order.totalPrice)} ${rewardUnit} 차감`))}catch(e){if(e.status===410){closed(e.message);return}alert(e.message)}}
async function cancelOrder(id){if(!confirm(`이 구매를 취소할까요?\n\n시장이 열려 있는 동안에만 취소할 수 있으며, 사용한 ${rewardUnit} 전액이 즉시 환불됩니다.`))return;try{const r=await api(`/api/market/${encodeURIComponent(marketToken)}/orders/${id}/cancel`,{method:"POST"});await loadMarket();document.querySelector("#app").prepend(el("div",{class:"notice success"},`${num(r.order.totalPrice)} ${rewardUnit} 환불 완료`))}catch(e){if(e.status===410){closed(e.message);return}alert(e.message)}}
async function start() {
  try { parseCallback(); }
  catch (e) { $(el("div", { class:"notice bad" }, e.message)); return; }
  const state = await fetch(`/api/market/${encodeURIComponent(marketToken)}/state`);
  const stateData = await state.json().catch(() => ({}));
  rewardUnit = stateData.rewardUnit || "달란트";
  document.title = `${rewardUnit} 시장 · SoopTalent`;
  if (state.status === 410) { closed(stateData.error); return; }
  if (!state.ok) { $(el("div", { class:"notice bad" }, unitText("이 달란트 시장을 찾을 수 없습니다."))); return; }
  if (!token) {
    const button = el("button", { class:"primary", onclick:login, disabled:true }, "SOOP으로 로그인");
    const consent = el("input", { type:"checkbox" });
    consent.addEventListener("change", () => { button.disabled = !consent.checked; });
    const consentText = el("span", {},
      el("a", { href:"/privacy", target:"_blank", rel:"noopener" }, "개인정보처리방침"),
      "을 확인했고, SOOP 아이디·닉네임과 구매 처리 정보의 처리에 동의합니다. ",
      el("strong", {}, "(필수)"),
    );
    $(el("section", { class:"login" },
      el("h1", {}, unitText("달란트 시장")),
      el("p", { class:"muted" }, "보상을 구매하려면 SOOP으로 로그인해 주세요."),
      button,
      el("label", { class:"privacy-check" }, consent, consentText),
    ));
    return;
  }
  try { await loadMarket(); }
  catch (e) {
    if (e.status === 401) { localStorage.removeItem(KEY); token = ""; start(); }
    else if (e.status === 410) closed(e.message);
    else $(el("div", { class:"notice bad" }, e.message));
  }
}
start();
</script></body></html>
