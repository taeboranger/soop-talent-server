services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sooptalent
      POSTGRES_PASSWORD: sooptalent
      POSTGRES_DB: sooptalent
    ports:
      - "5433:5432"          # 로컬 Postgres와 충돌하지 않도록 5433 사용
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sooptalent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
